name: CI

# Fast, infra-free quality gate: build + typecheck + lint + unit tests.
# Runs on every PR and push to main. The heavier E2E suite (Postgres + parser
# container) lives in e2e.yml and runs separately.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The repo is a generic RAG service; a tenant's name must not re-enter it.
      # A de-tenanting pass and a feature PR merged 32 minutes apart, and the
      # second silently reintroduced 134 occurrences plus a client-named
      # top-level directory — including one in source. This grep is the check
      # that would have caught all of it, and costs nothing.
      #
      # pnpm-lock.yaml is excluded: base64 integrity hashes contain the letters
      # by coincidence.
      - name: No tenant name in the repo
        run: |
          if git grep -niI 'twk' -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "::error::Tenant name found above. rag-system is generic — de-identify before merging."
            exit 1
          fi
          echo "clean: no tenant name in tracked files"

      - name: Unit tests
        run: pnpm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Blocking. Reads pnpm-lock.yaml directly; no install needed. Production
      # dependencies only: dev tooling never ships in the images. Accepted,
      # unfixable advisories are listed in package.json pnpm.auditConfig.
      - name: Audit Node production dependencies
        run: pnpm audit --prod --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Report-only: the parser has known advisories (starlette via FastAPI,
      # unstructured, markdownify, nltk) whose fixes change parsing behaviour
      # and need their own upgrade + eval. A warning annotation keeps the
      # check green instead of a red check everyone learns to ignore. Make
      # this blocking (drop the `|| echo`) once that backlog is cleared.
      - name: Audit parser dependencies (report-only)
        run: |
          pip install --quiet pip-audit
          pip-audit -r services/parser-py/requirements.txt --progress-spinner off \
            || echo "::warning title=pip-audit::pip-audit found vulnerabilities in services/parser-py dependencies (or failed to run); see the step log."

  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/parser-py
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/parser-py/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
