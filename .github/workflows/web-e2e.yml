name: Web E2E

# Browser-driven knowledge-base verification (tests/web-e2e). Separate from
# e2e.yml (which covers tests/e2e, the backend-only vitest e2e suite) because
# this one drives the real Next.js UI with Playwright against local inference
# — no hosted API key, but a much heavier cold-start (model downloads).
#
# No secrets: embeddings run in-process via ONNX and generation runs against
# a local Ollama endpoint, so nothing external is called AT TEST TIME. That
# is not the same as network-free — on a cold cache this job still pulls the
# ~430MB ONNX embedding model from Hugging Face and the ~4.7GB llama3.1:8b
# model from Ollama, and neither of those downloads goes through the app's
# own EGRESS_ALLOWED_HOSTS allow-list (that list gates the running services,
# not `ollama pull` or the seeding script's model fetch).

on:
  pull_request:
    paths:
      - "tests/web-e2e/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "docker/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch: {}

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The API and the ingestion setup need a real database and a real parser.
    # Without them `pnpm --filter @rag/api start` dies on connect and Playwright
    # reports only "Process from config.webServer was not able to start", which
    # is why this workflow had never completed a run. Mirrors e2e.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rag:rag@localhost:5432/rag
      PARSER_URL: http://localhost:8000

    steps:
      # This job is the heaviest in the repo: the parser image (~3.9GB), the
      # llama3.1:8b pull (~4.7GB), the ONNX embedder (~430MB), a full workspace
      # build and a Chromium download all land on one runner. Together they
      # exhaust the ~14GB an ubuntu-latest runner starts with, and the symptom
      # is an opaque "ENOSPC: no space left on device" from whichever step is
      # unlucky enough to be last. Reclaim the preinstalled toolchains this job
      # never touches (~25GB) before any of that starts. See PR #51 for the
      # earlier round of parser CI disk exhaustion.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Apply pgvector init bootstrap to Postgres
        run: |
          PGPASSWORD=rag psql -h localhost -U rag -d rag -f docker/init-db.sql

      - name: Build parser image
        run: docker build -t rag-parser:web-e2e services/parser-py

      - name: Run parser container
        run: |
          docker run -d --name rag-parser \
            -p 8000:8000 \
            -e PYTHONUNBUFFERED=1 \
            rag-parser:web-e2e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "parser ready"; exit 0
            fi
            sleep 1
          done
          echo "parser did not become ready" >&2
          docker logs rag-parser
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Caches, not secrets — the cold cost here is downloads, not compute.
      - name: Cache Hugging Face models (ONNX embedder, ~430MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5

      - name: Cache Ollama models (llama3.1:8b, ~4.7GB)
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-llama3.1-8b

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: ollama serve &

      - name: Wait for Ollama and pull llama3.1:8b
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "ollama ready"; break
            fi
            sleep 1
          done
          ollama pull llama3.1:8b

      # MUST run before the suite starts its servers. playwright.config.ts
      # runs `pnpm --filter @rag/api start` / `@rag/web start` — `next start`
      # (and the built api) serve whatever is already in dist/.next and never
      # rebuild. Three earlier tasks in this project reported green browser
      # runs against a stale bundle that predated the code they had just
      # added, which also masked a real production build failure for days.
      # A fresh CI checkout has no dist/.next at all, so skipping this step
      # does not silently pass — the webServer boot fails loudly instead.
      - name: Build workspace
        run: pnpm -r build

      # The API asserts on boot that 0000_init.sql's HNSW/GIN indexes and the
      # chunks_tsv_update trigger exist, and exits if they do not. The harness
      # does call applyMigrations (setup/stack.ts), but that runs in
      # globalSetup — after Playwright has already started the webServer — so
      # the API dies before the harness gets a turn. Migrate here instead.
      - name: Apply database migrations
        run: pnpm --filter @rag/db migrate

      - name: Install Playwright browsers
        run: pnpm --filter @rag/web-e2e exec playwright install --with-deps chromium

      - name: Run web E2E suite
        run: pnpm --filter @rag/web-e2e test:browser

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            tests/web-e2e/test-results
            tests/web-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
