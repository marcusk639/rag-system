name: Web E2E

# Browser-driven verification of the web stack (tests/web-e2e). Separate from
# e2e.yml (which covers tests/e2e, the backend-only vitest suite).
#
# CI runs the INFRASTRUCTURE subset only: auth, scope/grant, seeding and
# migrations. Those need a database and a parser, which this job provides, and
# they finish in seconds.
#
# The generation-dependent specs (compliance.spec.ts, kb.spec.ts — citations,
# self-retrieval, refusal) are deliberately NOT run here. They need
# llama3.1:8b, and a GitHub runner is CPU-only: a single RAG answer takes
# longer than the 120s test budget, and the first timeout saturates the CPU so
# the rest fail on time-to-headers too. Measured alternatives do not work
# either — llama3.2:3b confabulates instead of refusing (9/10), and
# llama3.2:1b produces no citations at all (5/10). Only the 8b passes 10/10.
#
# Run the full suite locally, where it passes in ~21s:
#   docker compose -f docker/docker-compose.yml up -d
#   ollama serve & ollama pull llama3.1:8b
#   pnpm -r build
#   E2E_SKIP_DOCKER_UP=1 pnpm --filter @rag/web-e2e test:browser

on:
  pull_request:
    paths:
      - "tests/web-e2e/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "docker/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch: {}

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The API and the ingestion setup need a real database and a real parser.
    # Without them `pnpm --filter @rag/api start` dies on connect and Playwright
    # reports only "Process from config.webServer was not able to start", which
    # is why this workflow had never completed a run. Mirrors e2e.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
          POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rag:rag@localhost:5432/rag
      PARSER_URL: http://localhost:8000
      # Postgres is a service container and the parser is started above, so the
      # harness must not try to `docker compose up` its own stack. Same flag
      # e2e.yml sets for the same reason.
      E2E_SKIP_DOCKER_UP: "1"

    steps:
      # This job is the heaviest in the repo: the parser image (~3.9GB), the
      # llama3.1:8b pull (~4.7GB), the ONNX embedder (~430MB), a full workspace
      # build and a Chromium download all land on one runner. Together they
      # exhaust the ~14GB an ubuntu-latest runner starts with, and the symptom
      # is an opaque "ENOSPC: no space left on device" from whichever step is
      # unlucky enough to be last. Reclaim the preinstalled toolchains this job
      # never touches (~25GB) before any of that starts. See PR #51 for the
      # earlier round of parser CI disk exhaustion.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Apply pgvector init bootstrap to Postgres
        run: |
          PGPASSWORD=rag psql -h localhost -U rag -d rag -f docker/init-db.sql

      - name: Build parser image
        run: docker build -t rag-parser:web-e2e services/parser-py

      - name: Run parser container
        run: |
          docker run -d --name rag-parser \
            -p 8000:8000 \
            -e PYTHONUNBUFFERED=1 \
            rag-parser:web-e2e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "parser ready"; exit 0
            fi
            sleep 1
          done
          echo "parser did not become ready" >&2
          docker logs rag-parser
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # globalSetup seeds the fixture corpus with the local ONNX embedder on
      # EVERY run, whichever specs are selected, so this ~430MB model is still
      # needed here even though the Ollama pull is gone. Cache it.
      # The path here and HF_CACHE_DIR on the suite step below MUST match, and
      # neither may use `~`. actions/cache expands a tilde itself, but an `env:`
      # value is passed through literally, so HF_CACHE_DIR=~/... would make the
      # library create a directory actually named "~" and the cache key could
      # never hit — which is what happened here: nothing was ever written to the
      # cached path, so every run re-downloaded the model.
      #
      # `runner.temp` rather than `github.workspace` so the cache never lands
      # inside the checkout, where `pnpm lint` / `format:check` globs would see
      # it. `runner` is not available in a job-level `env:`, hence the per-step
      # env below rather than hoisting it.
      - name: Cache Hugging Face models (ONNX embedder, ~430MB)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-${{ runner.os }}-bge-base-en-v1.5

      # MUST run before the suite starts its servers. playwright.config.ts
      # runs `pnpm --filter @rag/api start` / `@rag/web start` — `next start`
      # (and the built api) serve whatever is already in dist/.next and never
      # rebuild. Three earlier tasks in this project reported green browser
      # runs against a stale bundle that predated the code they had just
      # added, which also masked a real production build failure for days.
      # A fresh CI checkout has no dist/.next at all, so skipping this step
      # does not silently pass — the webServer boot fails loudly instead.
      - name: Build workspace
        run: pnpm -r build

      # The API asserts on boot that 0000_init.sql's HNSW/GIN indexes and the
      # chunks_tsv_update trigger exist, and exits if they do not. The harness
      # does call applyMigrations (setup/stack.ts), but that runs in
      # globalSetup — after Playwright has already started the webServer — so
      # the API dies before the harness gets a turn. Migrate here instead.
      - name: Apply database migrations
        run: pnpm --filter @rag/db migrate

      - name: Install Playwright browsers
        run: pnpm --filter @rag/web-e2e exec playwright install --with-deps chromium

      - name: Run web E2E suite
        # globalSetup seeds the fixture corpus with the local ONNX embedder, so
        # this is the step that reads (and on a cache miss, writes) the model.
        env:
          HF_CACHE_DIR: ${{ runner.temp }}/hf-cache
        run: pnpm --filter @rag/web-e2e run test:browser:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            tests/web-e2e/test-results
            tests/web-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
