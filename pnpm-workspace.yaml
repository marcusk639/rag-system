packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "examples/*"
  # scripts/ is a workspace package so `pnpm -r run test` picks up the Docker
  # build-gate tests in warm-model-verified.test.ts, and `pnpm -r run
  # typecheck` covers the .ts files here. It ships no code. The typecheck
  # resolves workspace imports through their built dist/, so it needs
  # `pnpm -r build` first, like every other package.
  - "scripts"

# Satisfies `"vite-plus": "catalog:"`, which gpt-tokenizer 4.x publishes in
# its own devDependencies (a reference to its upstream monorepo's catalog).
# `pnpm deploy` (every app Dockerfile) fails with
# ERR_PNPM_CATALOG_ENTRY_NOT_FOUND_FOR_SPEC without an entry here. Nothing in
# this workspace depends on vite-plus, and a dependency's devDependencies are
# never installed, so the version is never resolved or fetched.
catalog:
  vite-plus: "1.0.0"
